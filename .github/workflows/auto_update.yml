name: 官方公告全自动更新与分发

# 目标：用户零参与。国办发布次年放假安排后，自动核源→改表→构建→校验→分发到
# 网页/App数据/ICS/全球订阅/小组件全端。拿不准就静默放弃，绝不打扰用户。
#
# 不依赖用户任何设备：跑在 GitHub Actions 云端。
# 服务器推送用受限密钥 HAOLI_DEPLOY_KEY（只能写 /var/www/haoli 数据目录）。
on:
  schedule:
    - cron: "30 4 * * *"   # 北京 12:30（错开 audit.yml 的 12:00）
  workflow_dispatch:        # 允许手动触发（调试用）

permissions:
  contents: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  auto-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE: https://oyster111.top
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 还原受限 SSH 私钥
        env:
          HAOLI_DEPLOY_KEY: ${{ secrets.HAOLI_DEPLOY_KEY }}
        run: |
          if [ -n "$HAOLI_DEPLOY_KEY" ]; then
            printf '%s\n' "$HAOLI_DEPLOY_KEY" > "$RUNNER_TEMP/haoli_deploy_key"
            chmod 600 "$RUNNER_TEMP/haoli_deploy_key"
            echo "HAOLI_DEPLOY_KEY_FILE=$RUNNER_TEMP/haoli_deploy_key" >> "$GITHUB_ENV"
          else
            echo "::warning::HAOLI_DEPLOY_KEY 未配置，将跳过服务器同步"
          fi

      - name: 核对 → 核源 → 改表 → 构建 → 校验
        id: update
        run: |
          set +e
          python auto_update.py
          CODE=$?
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          # 0=无变化或成功；2=拿不准静默放弃；1=系统错误
          # 只有 2 且确实判断不了时才在此留日志，不 @ 用户、不 failure
          if [ "$CODE" -eq 1 ]; then
            echo "::error::自动更新遇到系统错误（构建/校验失败），源表已回滚"
            exit 1
          fi
          if [ -f .auto_update_changed ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 分发到 haoli-site 仓 + 服务器 + CDN
        if: steps.update.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAOLI_SITE_TOKEN: ${{ secrets.HAOLI_SITE_TOKEN }}
          HAOLI_DEPLOY_KEY_FILE: ${{ env.HAOLI_DEPLOY_KEY_FILE }}
        run: |
          # 用 git diff 找本次变化的发布产物（自动更新已 commit 到工作区但未提交）
          FILES=$(git diff --name-only -- data ics 2026 2027 stats.json sitemap.xml robots.txt \
                  | grep -vE 'apk.json|build-state.json|official-notice-report.json|official-notices/' \
                  | paste -sd, -)
          echo "变化文件: $FILES"
          if [ -n "$FILES" ]; then
            python ci_publish.py --files "$FILES"
          fi

      - name: 提交源表与数据变化
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "haoli-ci"
          git config user.email "haoli-ci@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "auto: 官方公告更新（全端一致，不发 APK）· $(date +%F)"
            git push origin main
          fi

      - name: 微信通知（仅真入库时推送）
        if: steps.update.outputs.changed == 'true'
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TZ: Asia/Shanghai
        run: python notify_ingest.py --kind holiday

      - name: 留痕（无变化或放弃）
        if: steps.update.outputs.changed != 'true'
        run: echo "本次无数据变化或已按红线静默放弃，未改动任何文件。"
